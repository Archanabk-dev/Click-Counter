<!DOCTYPE html>
<html>
<head>
<title>Click Counter</title>
<style>
body { text-align: center; font-family: Arial; margin-top: 100px; background: #f0f0f0; }
h1 { font-size: 60px; }
button { padding: 15px 30px; font-size: 20px; background: blue; color: white; border: none; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>
<h1>Click Counter</h1>
<h1 id="count">0</h1>
<button onclick="increase()">Increase</button>
<button onclick="decrease()">Decrease</button>

<script>
let count = 0;
function increase() {
  count = count + 1;
  document.getElementById("count").innerText = count;
}
function decrease() {
  count = count - 1;
  document.getElementById("count").innerText = count;
}
</script>
</body>
</html>
